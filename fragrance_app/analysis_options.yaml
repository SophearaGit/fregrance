include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    invalid_use_of_internal_member: error
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    # --- Safety / correctness ---
    - prefer_relative_imports
    - avoid_dynamic_calls
    - avoid_type_to_string
    - cancel_subscriptions # Realm/streams: prevents leaks
    - close_sinks
    - unawaited_futures # catches missing awaits in async POS flows
    - discarded_futures

    # --- Cleanliness ---
    - prefer_final_locals
    - prefer_final_in_for_each
    - unnecessary_late
    - use_super_parameters
    - require_trailing_commas
